{% if messages %}
<div class="container my-3 no-print">
  {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags %}{{ message.tags }}{% else %}info{% endif %} alert-dismissible fade show shadow-sm" role="alert">
      <div class="d-flex align-items-center">
        {% if message.tags == 'success' %}
          <i class="bi bi-check-circle-fill fs-5 me-2 text-success"></i>
        {% elif message.tags == 'error' or message.tags == 'danger' %}
          <i class="bi bi-exclamation-triangle-fill fs-5 me-2 text-danger"></i>
        {% elif message.tags == 'warning' %}
          <i class="bi bi-exclamation-circle-fill fs-5 me-2 text-warning"></i>
        {% else %}
          <i class="bi bi-info-circle-fill fs-5 me-2 text-info"></i>
        {% endif %}
        <div>{{ message }}</div>
      </div>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  {% endfor %}
</div>
{% endif %}
